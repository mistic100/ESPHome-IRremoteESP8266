esphome:
  name: test-all

external_components:
  - source:
      type: local
      path: ../components

esp32:
  board: esp32dev
  framework:
    type: arduino

remote_transmitter:
  id: ir_led
  pin: 4
  carrier_duty_percent: 50%

climate:
  - platform: electra
    id: my_electra
    name: 'Electra'
    debounce: 200ms

  - platform: fujitsu
    id: my_fujitsu
    model: ARREB1E
    horizontal_swing: false
    debounce: 200ms
    name: 'Fujitsu'

  - platform: panasonic
    id: my_panasonic
    model: DKE
    name: 'Panasonic'
    debounce: 200ms

  - platform: sharp
    id: my_sharp
    model: A705
    name: 'Sharp'
    debounce: 200ms

  - platform: mitsubishi
    id: my_mitsubishi_ac
    model: MITSUBISHI_AC
    name: 'Mitsubishi AC'
    debounce: 200ms

  - platform: mitsubishi
    id: my_mitsubishi_136
    model: MITSUBISHI136
    name: 'Mitsubishi 136'
    debounce: 200ms

  - platform: mitsubishi
    id: my_mitsubishi_112
    model: MITSUBISHI112
    name: 'Mitsubishi 112'
    debounce: 200ms

  - platform: haier
    id: my_haier_ac
    model: HAIER_AC
    name: 'Haier AC'
    debounce: 200ms

  - platform: haier
    id: my_haier_ac160
    model: HAIER_AC160
    name: 'Haier AC160'
    debounce: 200ms

  - platform: haier
    id: my_haier_ac176
    model: HAIER_AC176
    name: 'Haier AC176'
    debounce: 200ms

  - platform: haier
    id: my_haier_ac_yrw02
    model: HAIER_AC_YRW02
    name: 'Haier AC YRW02'
    debounce: 200ms

button:
  - platform: template
    name: 'Fujitsu Step vertical'
    on_press:
      then:
        - lambda: |-
            id(my_fujitsu).step_vertical();

  - platform: template
    name: 'Fujitsu Toggle econo'
    on_press:
      then:
        - lambda: |-
            id(my_fujitsu).toggle_econo();

  - platform: template
    name: 'Fujitsu Toggle powerful'
    on_press:
      then:
        - lambda: |-
            id(my_fujitsu).toggle_powerful();
